name: Validate cartridge

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run package:metadata
      - uses: actions/upload-artifact@v4
        with:
          name: rentals-assets-node-${{ matrix.node }}
          path: |
            cartridges/plugin_rentals/cartridge/static/
            dist/rentals-metadata.zip
